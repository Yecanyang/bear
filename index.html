<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拉拉熊的回家計畫</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        /* ====== 手機版卡片式表格優化 (RWD) ====== */
        @media (max-width: 767px) {
            .rwd-table thead { display: none; }
            .rwd-table, .rwd-table tbody, .rwd-table tr, .rwd-table td { 
                display: block; 
                width: 100%; 
            }
            .rwd-table tr { 
                margin-bottom: 1.25rem; 
                background: #fff; 
                border: 1px solid #e2e8f0; 
                border-radius: 0.75rem; 
                padding: 1rem; 
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); 
            }
            .rwd-table td { 
                display: flex; 
                justify-content: space-between; 
                align-items: center; 
                padding: 0.6rem 0; 
                border-bottom: 1px dashed #e2e8f0; 
                text-align: right;
            }
            .rwd-table td:last-child { 
                border-bottom: none; 
                padding-bottom: 0; 
            }
            .rwd-table td::before { 
                content: attr(data-label); 
                font-weight: 600; 
                color: #64748b; 
                font-size: 0.8rem; 
                margin-right: 1rem; 
            }
            
            /* 針對特定欄位進行微調 */
            .rwd-table td.col-notes { 
                flex-direction: column; 
                align-items: flex-start; 
                text-align: left; 
            }
            .rwd-table td.col-notes::before { 
                margin-bottom: 0.3rem; 
            }
            .rwd-table td.col-actions { 
                justify-content: flex-end; 
                gap: 0.75rem; 
                border-top: 1px solid #f1f5f9; 
                padding-top: 1rem; 
                margin-top: 0.5rem;
            }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-12">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i data-lucide="box" class="w-8 h-8"></i>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">進出貨與帳務管理系統</h1>
                    <div class="flex items-center space-x-2 text-xs text-indigo-200 mt-0.5">
                        <span id="cloudStatusBadge" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-amber-100 text-amber-800">
                            離線模式 (本機儲存)
                        </span>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="toggleCloudConfig()" class="bg-indigo-700 hover:bg-indigo-800 text-white px-3.5 py-2 rounded-lg text-sm font-medium flex items-center space-x-2 transition shadow-sm border border-indigo-500">
                    <i data-lucide="cloud" class="w-4 h-4"></i>
                    <span>☁️ 雲端基地</span>
                </button>
                <button onclick="exportCSV()" class="bg-indigo-700 hover:bg-indigo-800 text-white px-3.5 py-2 rounded-lg text-sm font-medium flex items-center space-x-2 transition shadow-sm border border-indigo-500">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">匯出 CSV</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 space-y-6">

        <!-- Cloud Base Settings Panel -->
        <div id="cloudConfigPanel" class="hidden bg-slate-900 text-white rounded-xl shadow-lg p-6 border border-slate-700">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                <div class="flex items-center space-x-2">
                    <i data-lucide="database" class="w-5 h-5 text-indigo-400"></i>
                    <h2 class="text-lg font-bold">☁️ 雲端基地連結設定 (Google 試算表)</h2>
                </div>
                <button onclick="toggleCloudConfig(false)" class="text-slate-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <p class="text-xs text-slate-400 mb-3">請貼入您透過 Google Apps Script 部署獲得的 Web App 網址（以 /exec 結尾）。</p>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="url" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec" class="flex-1 px-3.5 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="saveApiUrl()" class="bg-indigo-600 hover:bg-indigo-500 px-5 py-2 rounded-lg text-sm font-medium transition shadow">儲存並連結</button>
                <button onclick="clearApiUrl()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium transition text-slate-300">斷開連線</button>
            </div>
        </div>

        <!-- Metrics Overview -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center space-x-4">
                <div class="p-3 bg-blue-50 text-blue-600 rounded-lg">
                    <i data-lucide="dollar-sign" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">總銷售金額</p>
                    <p id="totalPrice" class="text-2xl font-bold text-slate-900 mt-1">$0</p>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center space-x-4">
                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg">
                    <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">總已收金額</p>
                    <p id="totalReceived" class="text-2xl font-bold text-emerald-600 mt-1">$0</p>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center space-x-4">
                <div class="p-3 bg-rose-50 text-rose-600 rounded-lg">
                    <i data-lucide="clock" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">未收總尾款</p>
                    <p id="totalPending" class="text-2xl font-bold text-rose-600 mt-1">$0</p>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex items-center space-x-4">
                <div class="p-3 bg-amber-50 text-amber-600 rounded-lg">
                    <i data-lucide="package" class="w-6 h-6"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wider">待寄出件數</p>
                    <p id="pendingShipCount" class="text-2xl font-bold text-amber-600 mt-1">0 件</p>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="flex flex-col sm:flex-row w-full md:w-auto gap-3">
                <button onclick="toggleForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium flex items-center justify-center space-x-2 transition shadow-sm w-full sm:w-auto">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>新增進出貨紀錄</span>
                </button>
                <button onclick="fetchCloudData()" id="syncBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2.5 rounded-lg text-sm font-medium flex items-center justify-center space-x-2 transition w-full sm:w-auto">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    <span>重新整理數據</span>
                </button>
            </div>

            <div class="flex flex-col sm:flex-row w-full md:w-auto gap-3">
                <div class="relative w-full sm:w-64">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="renderTable()" placeholder="搜尋姓名、商品或備註..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <select id="statusFilter" onchange="renderTable()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700 w-full sm:w-auto">
                    <option value="all">全部狀態</option>
                    <option value="arrived">已到貨</option>
                    <option value="not_arrived">未到貨</option>
                    <option value="shipped">已寄出</option>
                    <option value="not_shipped">未寄出</option>
                    <option value="unpaid">尚有尾款未收</option>
                </select>
            </div>
        </div>

        <!-- Form Panel -->
        <div id="formContainer" class="hidden bg-white rounded-xl shadow-md border border-indigo-100 p-6 transition-all">
            <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                <h2 id="formTitle" class="text-lg font-bold text-slate-900">新增訂單紀錄</h2>
                <button onclick="toggleForm(false)" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="recordForm" onsubmit="saveRecord(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <input type="hidden" id="recordId">
                <input type="hidden" id="imageBase64">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">日期 *</label>
                    <input type="date" id="dateInput" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">人名 / 客戶 * <span class="text-indigo-600 font-normal">(有多人可用逗號、頓號或 Enter 換行隔開)</span></label>
                    <textarea id="personInput" rows="2" required placeholder="例如：張三, 李四, 王五 或按 Enter 換行寫多人" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">商品名稱 *</label>
                    <input type="text" id="productInput" required placeholder="例如：耳機" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">單人售價 ($) *</label>
                    <input type="number" id="priceInput" min="0" step="1" required placeholder="0" oninput="calculatePending()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">單人已收金額 ($) *</label>
                    <input type="number" id="receivedInput" min="0" step="1" required placeholder="0" oninput="calculatePending()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">未收金額 / 尾款 ($)</label>
                    <input type="text" id="pendingInput" readonly class="w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-lg text-sm text-slate-600 cursor-not-allowed font-bold">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">到貨狀態</label>
                    <select id="arrivedSelect" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="false">未到貨</option>
                        <option value="true">已到貨</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">寄出狀態</label>
                    <select id="shippedSelect" onchange="calculatePending()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="false">未寄出</option>
                        <option value="true">已寄出 (尾款自動歸零)</option>
                    </select>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">商品圖片 (選擇圖片檔或貼上網址)</label>
                    <div class="flex items-center space-x-3">
                        <input type="file" id="imageFileInput" accept="image/*" onchange="handleImageUpload(event)" class="text-xs text-slate-500 w-full md:w-auto file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                        <input type="url" id="imageUrlInput" placeholder="或貼上圖片網址" onchange="handleImageUrlChange(event)" class="flex-1 px-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none hidden md:block">
                    </div>
                    <div id="imagePreviewBox" class="mt-2 hidden flex items-center space-x-2">
                        <img id="imagePreview" src="" class="w-12 h-12 object-cover rounded border border-slate-200">
                        <button type="button" onclick="removeImage()" class="text-xs text-rose-500 hover:underline">刪除圖片</button>
                    </div>
                </div>

                <div class="md:col-span-2 lg:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">客人備註 / 需求說明</label>
                    <input type="text" id="notesInput" placeholder="例如：指定全家取貨、預計10號寄出..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div class="md:col-span-2 lg:col-span-4 flex justify-end space-x-3 mt-2">
                    <button type="button" onclick="toggleForm(false)" class="px-4 py-2 border border-slate-300 rounded-lg text-sm text-slate-600 hover:bg-slate-50 transition w-full sm:w-auto">取消</button>
                    <button type="submit" id="saveSubmitBtn" class="px-5 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 transition shadow-sm w-full sm:w-auto">儲存紀錄</button>
                </div>
            </form>
        </div>

        <!-- Table View -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <!-- 加入 overflow-x-auto 保持電腦版橫向滾動 -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse rwd-table">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            <th class="py-3 px-4">圖片</th>
                            <th class="py-3 px-4">日期</th>
                            <th class="py-3 px-4">人名</th>
                            <th class="py-3 px-4">商品名稱</th>
                            <th class="py-3 px-4 text-right">售價</th>
                            <th class="py-3 px-4 text-right">已收金額</th>
                            <th class="py-3 px-4 text-right">未收尾款</th>
                            <th class="py-3 px-4 text-center">到貨狀態</th>
                            <th class="py-3 px-4 text-center">寄出狀態</th>
                            <th class="py-3 px-4">備註</th>
                            <th class="py-3 px-4 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200 text-sm">
                    </tbody>
                </table>
            </div>
            
            <div id="emptyState" class="hidden py-12 text-center text-slate-400">
                <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
                <p>尚無任何紀錄，請點擊「新增進出貨紀錄」開始新增。</p>
            </div>
        </div>

    </main>

    <script>
        let records = JSON.parse(localStorage.getItem('inventory_records')) || [];
        let apiUrl = localStorage.getItem('cloud_api_url') || '';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
            updateCloudBadge();
            if (apiUrl) {
                document.getElementById('apiUrlInput').value = apiUrl;
                fetchCloudData();
            } else {
                renderTable();
            }
            lucide.createIcons();
        });

        function updateCloudBadge() {
            const badge = document.getElementById('cloudStatusBadge');
            if (apiUrl) {
                badge.className = "inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-emerald-100 text-emerald-800";
                badge.innerText = "☁️ 雲端基地已連線 (Google 試算表)";
            } else {
                badge.className = "inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-amber-100 text-amber-800";
                badge.innerText = "離線模式 (僅儲存於本機)";
            }
        }

        function toggleCloudConfig(show) {
            const panel = document.getElementById('cloudConfigPanel');
            if (show === undefined) panel.classList.toggle('hidden');
            else if (show) panel.classList.remove('hidden');
            else panel.classList.add('hidden');
        }

        function saveApiUrl() {
            const url = document.getElementById('apiUrlInput').value.trim();
            if (!url.startsWith('https://script.google.com/')) {
                alert('請輸入正確的 Google Apps Script Web App 網址！');
                return;
            }
            apiUrl = url;
            localStorage.setItem('cloud_api_url', apiUrl);
            updateCloudBadge();
            toggleCloudConfig(false);
            fetchCloudData();
        }

        function clearApiUrl() {
            if (confirm('確定要斷開雲端基地連線嗎？')) {
                apiUrl = '';
                localStorage.removeItem('cloud_api_url');
                document.getElementById('apiUrlInput').value = '';
                updateCloudBadge();
                toggleCloudConfig(false);
            }
        }

        async function fetchCloudData() {
            if (!apiUrl) {
                renderTable();
                return;
            }
            const syncBtn = document.getElementById('syncBtn');
            syncBtn.classList.add('opacity-50', 'pointer-events-none');

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                if (Array.isArray(data)) {
                    records = data;
                    localStorage.setItem('inventory_records', JSON.stringify(records));
                    renderTable();
                }
            } catch (err) {
                console.error(err);
                alert('無法從雲端基地讀取資料，請確認 API 網址與權限設定。');
            } finally {
                syncBtn.classList.remove('opacity-50', 'pointer-events-none');
            }
        }

        async function syncToCloud(action, recordData) {
            if (!apiUrl) return;
            try {
                await fetch(apiUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, ...recordData })
                });
            } catch (err) {
                console.error('雲端同步失敗', err);
            }
        }

        function calculatePending() {
            const price = parseFloat(document.getElementById('priceInput').value) || 0;
            const received = parseFloat(document.getElementById('receivedInput').value) || 0;
            const isShipped = document.getElementById('shippedSelect').value === 'true';
            
            const pendingInput = document.getElementById('pendingInput');
            if (isShipped) {
                pendingInput.value = "$0 (已付清)";
                pendingInput.className = "w-full px-3 py-2 bg-emerald-50 border border-emerald-300 rounded-lg text-sm text-emerald-700 font-bold cursor-not-allowed";
            } else {
                const pending = Math.max(0, price - received);
                pendingInput.value = "$" + pending;
                pendingInput.className = "w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-lg text-sm text-slate-600 font-bold cursor-not-allowed";
            }
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxDim = 150;
                    let w = img.width, h = img.height;

                    if (w > h) {
                        if (w > maxDim) { h *= maxDim / w; w = maxDim; }
                    } else {
                        if (h > maxDim) { w *= maxDim / h; h = maxDim; }
                    }

                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    document.getElementById('imageBase64').value = compressedBase64;
                    document.getElementById('imagePreview').src = compressedBase64;
                    document.getElementById('imagePreviewBox').classList.remove('hidden');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleImageUrlChange(e) {
            const url = e.target.value.trim();
            if (url) {
                document.getElementById('imageBase64').value = url;
                document.getElementById('imagePreview').src = url;
                document.getElementById('imagePreviewBox').classList.remove('hidden');
            }
        }

        function removeImage() {
            document.getElementById('imageBase64').value = '';
            document.getElementById('imageFileInput').value = '';
            document.getElementById('imageUrlInput').value = '';
            document.getElementById('imagePreview').src = '';
            document.getElementById('imagePreviewBox').classList.add('hidden');
        }

        function toggleForm(show = true) {
            const container = document.getElementById('formContainer');
            if (show) container.classList.remove('hidden');
            else {
                container.classList.add('hidden');
                resetForm();
            }
        }

        function resetForm() {
            document.getElementById('recordForm').reset();
            document.getElementById('recordId').value = '';
            removeImage();
            document.getElementById('formTitle').innerText = '新增訂單紀錄';
            document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
            calculatePending();
        }

        async function saveRecord(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('saveSubmitBtn');
            saveBtn.innerText = '處理中...';
            saveBtn.disabled = true;

            const recordId = document.getElementById('recordId').value;
            const date = document.getElementById('dateInput').value;
            const rawPerson = document.getElementById('personInput').value.trim();
            const product = document.getElementById('productInput').value.trim();
            const price = parseFloat(document.getElementById('priceInput').value) || 0;
            const received = parseFloat(document.getElementById('receivedInput').value) || 0;
            const arrived = document.getElementById('arrivedSelect').value === 'true';
            const shipped = document.getElementById('shippedSelect').value === 'true';
            const image = document.getElementById('imageBase64').value || '';
            const notes = document.getElementById('notesInput').value.trim();

            if (recordId) {
                const recordData = { id: recordId, date, person: rawPerson, product, price, received, arrived, shipped, image, notes };
                const existingIndex = records.findIndex(r => r.id === recordId);
                if (existingIndex > -1) records[existingIndex] = recordData;
                
                localStorage.setItem('inventory_records', JSON.stringify(records));
                renderTable();
                toggleForm(false);

                await syncToCloud('save', recordData);
            } else {
                const names = rawPerson.split(/[,，\n\r、]+/).map(n => n.trim()).filter(n => n.length > 0);

                if (names.length === 0) {
                    alert('請輸入人名！');
                    saveBtn.innerText = '儲存紀錄';
                    saveBtn.disabled = false;
                    return;
                }

                const syncPromises = [];
                const baseTimestamp = Date.now();

                for (let i = names.length - 1; i >= 0; i--) {
                    const singleName = names[i];
                    const singleId = (baseTimestamp + i).toString();
                    const recordData = { 
                        id: singleId, date, person: singleName, product, price, received, arrived, shipped, image, notes 
                    };

                    records.unshift(recordData);
                    syncPromises.push(syncToCloud('save', recordData));
                }

                localStorage.setItem('inventory_records', JSON.stringify(records));
                renderTable();
                toggleForm(false);

                await Promise.all(syncPromises);
            }

            saveBtn.innerText = '儲存紀錄';
            saveBtn.disabled = false;
        }

        async function deleteRecord(id) {
            if (confirm('確定要刪除這筆紀錄嗎？')) {
                records = records.filter(r => r.id !== id);
                localStorage.setItem('inventory_records', JSON.stringify(records));
                renderTable();
                await syncToCloud('delete', { id });
            }
        }

        async function toggleStatus(id, field) {
            const item = records.find(r => r.id === id);
            if (item) {
                item[field] = !item[field];
                localStorage.setItem('inventory_records', JSON.stringify(records));
                renderTable();
                await syncToCloud('save', item);
            }
        }

        function editRecord(id) {
            const item = records.find(r => r.id === id);
            if (!item) return;

            document.getElementById('recordId').value = item.id;
            document.getElementById('dateInput').value = item.date;
            document.getElementById('personInput').value = item.person;
            document.getElementById('productInput').value = item.product;
            document.getElementById('priceInput').value = item.price;
            document.getElementById('receivedInput').value = item.received;
            document.getElementById('arrivedSelect').value = item.arrived ? 'true' : 'false';
            document.getElementById('shippedSelect').value = item.shipped ? 'true' : 'false';
            document.getElementById('notesInput').value = item.notes || '';

            if (item.image) {
                document.getElementById('imageBase64').value = item.image;
                document.getElementById('imagePreview').src = item.image;
                document.getElementById('imagePreviewBox').classList.remove('hidden');
            } else {
                removeImage();
            }

            document.getElementById('formTitle').innerText = '編輯訂單紀錄';
            calculatePending();
            toggleForm(true);
        }

        function renderTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('statusFilter').value;

            const filtered = records.filter(r => {
                const matchesSearch = (r.person || '').toLowerCase().includes(search) || 
                                      (r.product || '').toLowerCase().includes(search) ||
                                      (r.notes || '').toLowerCase().includes(search);
                let matchesFilter = true;

                if (filter === 'arrived') matchesFilter = r.arrived;
                else if (filter === 'not_arrived') matchesFilter = !r.arrived;
                else if (filter === 'shipped') matchesFilter = r.shipped;
                else if (filter === 'not_shipped') matchesFilter = !r.shipped;
                else if (filter === 'unpaid') matchesFilter = !r.shipped && (r.price - r.received) > 0;

                return matchesSearch && matchesFilter;
            });

            const totalPrice = records.reduce((sum, r) => sum + r.price, 0);
            const totalReceived = records.reduce((sum, r) => sum + r.received, 0);
            const totalPending = records.reduce((sum, r) => sum + (r.shipped ? 0 : Math.max(0, r.price - r.received)), 0);
            const pendingShipCount = records.filter(r => !r.shipped).length;

            document.getElementById('totalPrice').innerText = '$' + totalPrice.toLocaleString();
            document.getElementById('totalReceived').innerText = '$' + totalReceived.toLocaleString();
            document.getElementById('totalPending').innerText = '$' + totalPending.toLocaleString();
            document.getElementById('pendingShipCount').innerText = pendingShipCount + ' 件';

            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach(r => {
                    const pending = r.shipped ? 0 : Math.max(0, r.price - r.received);
                    const isPaidInFull = r.shipped || pending === 0;

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition';

                    const imgTag = r.image 
                        ? `<img src="${r.image}" class="w-10 h-10 object-cover rounded border border-slate-200">`
                        : `<div class="w-10 h-10 bg-slate-100 text-slate-400 rounded flex items-center justify-center text-xs"><i data-lucide="image" class="w-4 h-4"></i></div>`;

                    // 加入 data-label 屬性以支援手機版卡片顯示標題
                    tr.innerHTML = `
                        <td class="py-3 px-4 col-img" data-label="圖片">${imgTag}</td>
                        <td class="py-3 px-4 font-mono text-slate-600" data-label="日期">${r.date}</td>
                        <td class="py-3 px-4 font-semibold text-slate-800" data-label="人名">${escapeHtml(r.person)}</td>
                        <td class="py-3 px-4 text-slate-700" data-label="商品名稱">${escapeHtml(r.product)}</td>
                        <td class="py-3 px-4 text-right font-medium text-slate-900" data-label="售價">$${r.price.toLocaleString()}</td>
                        <td class="py-3 px-4 text-right text-emerald-600 font-medium" data-label="已收金額">$${r.received.toLocaleString()}</td>
                        <td class="py-3 px-4 text-right" data-label="未收尾款">
                            ${isPaidInFull 
                                ? `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-700">$0 (已付清)</span>` 
                                : `<span class="font-bold text-rose-600">$${pending.toLocaleString()}</span>`}
                        </td>
                        <td class="py-3 px-4 text-center" data-label="到貨狀態">
                            <button onclick="toggleStatus('${r.id}', 'arrived')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition ${r.arrived ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-amber-100 text-amber-700 hover:bg-amber-200'}">
                                ${r.arrived ? '已到貨' : '未到貨'}
                            </button>
                        </td>
                        <td class="py-3 px-4 text-center" data-label="寄出狀態">
                            <button onclick="toggleStatus('${r.id}', 'shipped')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition ${r.shipped ? 'bg-blue-100 text-blue-700 hover:bg-blue-200' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                ${r.shipped ? '已寄出' : '未寄出'}
                            </button>
                        </td>
                        <td class="py-3 px-4 text-slate-500 text-xs max-w-xs truncate col-notes" data-label="備註">${escapeHtml(r.notes || '-')}</td>
                        <td class="py-3 px-4 text-center space-x-2 col-actions" data-label="操作">
                            <button onclick="editRecord('${r.id}')" class="p-2 bg-slate-100 rounded-lg text-slate-400 hover:text-indigo-600 transition" title="編輯">
                                <i data-lucide="edit-3" class="w-4 h-4 inline"></i>
                            </button>
                            <button onclick="deleteRecord('${r.id}')" class="p-2 bg-slate-100 rounded-lg text-slate-400 hover:text-rose-600 transition" title="刪除">
                                <i data-lucide="trash-2" class="w-4 h-4 inline"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            lucide.createIcons();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        function exportCSV() {
            if (records.length === 0) {
                alert('目前無可供匯出的紀錄！');
                return;
            }

            let csvContent = "\uFEFF";
            csvContent += "日期,人名,商品名稱,售價,已收金額,未收金額/尾款,到貨狀態,寄出狀態,備註\n";

            records.forEach(r => {
                const pending = r.shipped ? 0 : Math.max(0, r.price - r.received);
                const row = [
                    `"${r.date}"`,
                    `"${(r.person || '').replace(/"/g, '""')}"`,
                    `"${(r.product || '').replace(/"/g, '""')}"`,
                    r.price,
                    r.received,
                    r.shipped ? "已付清" : pending,
                    r.arrived ? "已到貨" : "未到貨",
                    r.shipped ? "已寄出" : "未寄出",
                    `"${(r.notes || '').replace(/"/g, '""')}"`
                ];
                csvContent += row.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `進出貨紀錄表_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
